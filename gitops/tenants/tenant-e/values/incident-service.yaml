image:
  repository: incident-service
  tag: nats-v1
  pullPolicy: Never

postgres:
  enabled: false
  createSchema: false
  externalHost: platform-postgres-rw.platform.svc.cluster.local
  database: platform_db
  schema: tenant_e
  user: tenant_e_user
  auth:
    existingSecret: tenant-e-db-credentials

cache:
  enabled: true
  url: redis://dragonfly.dragonfly.svc.cluster.local:6379
  username: tenant_e_cache_user
  existingSecret: dragonfly-cache-tenant-e
  ttlSeconds: 60

nats:
  enabled: true
  url: nats://nats.nats.svc.cluster.local:4222
  stream: ASSET_EVENTS
