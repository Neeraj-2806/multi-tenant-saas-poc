image:
  repository: asset-service
  tag: nats-v1
  pullPolicy: Never

postgres:
  enabled: false
  createSchema: false
  externalHost: platform-postgres-rw.platform.svc.cluster.local
  database: platform_db
  schema: tenant_d
  user: tenant_d_user
  auth:
    existingSecret: tenant-d-db-credentials

cache:
  enabled: true
  url: redis://dragonfly.dragonfly.svc.cluster.local:6379
  username: tenant_d_cache_user
  existingSecret: dragonfly-cache-tenant-d
  ttlSeconds: 60

nats:
  enabled: true
  url: nats://nats.nats.svc.cluster.local:4222
  stream: ASSET_EVENTS
