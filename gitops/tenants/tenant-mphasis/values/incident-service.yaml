image:
  repository: incident-service
  tag: nats-v1
  pullPolicy: Never

postgres:
  enabled: false
  createSchema: false
  externalHost: platform-postgres-rw.platform.svc.cluster.local
  database: platform_db
  schema: tenant_mphasis
  user: tenant_mphasis_user
  auth:
    existingSecret: tenant-mphasis-db-credentials

cache:
  enabled: true
  url: redis://dragonfly.dragonfly.svc.cluster.local:6379
  username: tenant_mphasis_cache_user
  existingSecret: dragonfly-cache-tenant-mphasis
  ttlSeconds: 60

nats:
  enabled: true
  url: nats://nats.nats.svc.cluster.local:4222
  stream: ASSET_EVENTS
