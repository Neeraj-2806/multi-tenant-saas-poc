apiVersion: v1
kind: Pod
metadata:
  name: {{ include "frontend.fullname" . }}-test-connection
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args: ["-q", "-O", "-", "-T", "5", "http://{{ include "frontend.fullname" . }}:{{ .Values.service.port }}/"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
