{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ required "istio.host is required when istio.enabled=true" .Values.istio.host | quote }}
  gateways:
    - "{{ required "istio.gateway.namespace is required" .Values.istio.gateway.namespace }}/{{ required "istio.gateway.name is required" .Values.istio.gateway.name }}"
  http:
    - route:
        - destination:
            host: {{ include "frontend.fullname" . }}
            port:
              number: {{ .Values.service.port }}
{{- end }}
