{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "asset-service.postgresServiceName" . }}
  labels:
    {{- include "asset-service.postgresLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
      protocol: TCP
  selector:
    {{- include "asset-service.postgresSelectorLabels" . | nindent 4 }}
{{- end }}
