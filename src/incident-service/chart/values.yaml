# DEFAULTS ONLY - no environment names, no real registry URL, no replica count "for prod",
# no IRSA annotation. Environment values live in gitops/base/platform/incident-service/.

nameOverride: ""
# Other services reach this one by this DNS name (asset-service calls http://incident-service:5002).
fullnameOverride: incident-service

replicaCount: 1

image:
  repository: "" # supplied by values-common.yaml
  tag: "" # supplied by version.yaml
  pullPolicy: IfNotPresent

containerPort: 5002

service:
  type: ClusterIP
  port: 5002

serviceAccount:
  create: true
  name: ""
  annotations: {} # empty - Pod Identity, not IRSA

podSecurityContext: {}
securityContext: {}
nodeSelector: {}

strategy:
  maxSurge: 1
  maxUnavailable: 0

pdb:
  enabled: true
  maxUnavailable: 1

autoscaling:
  enabled: false # needs metrics-server
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 200m, memory: 256Mi }

# The app has no /health endpoint yet, so probes stay off.
livenessProbe:
  enabled: false
  httpGet: { path: /health, port: 5002 }
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  enabled: false
  httpGet: { path: /health, port: 5002 }
  initialDelaySeconds: 5
  periodSeconds: 10

postgres:
  schema: public # override with tenant schema, e.g. tenant_a
  createSchema: false # local Minikube only; onboarding provisions schemas later
  enabled: true # false = use an external database (set externalHost)
  externalHost: ""
  image:
    repository: postgres
    tag: "16"
  port: 5432
  user: postgres
  database: incident_db
  auth:
    existingSecret: "" # name of a Secret with key "password"; if empty the chart creates one
    password: "" # only used when existingSecret is empty
  persistence:
    storageClass: "" # empty = cluster default
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

# One shared Dragonfly server, with a tenant-specific key prefix derived from PG_SCHEMA.
# Keep disabled until Dragonfly, credentials and ACLs are configured.
cache:
  enabled: false
  url: "" # e.g. redis://dragonfly.platform.svc.cluster.local:6379
  ttlSeconds: 60
  username: "" # required when enabled: tenant-specific Dragonfly ACL user
  existingSecret: "" # required when enabled: tenant-specific Secret with key 'password'

# Shared NATS JetStream. Only enable after the ASSET_EVENTS stream exists.
# Keep a separate tenant subject prefix based on postgres.schema.
nats:
  enabled: false
  url: "nats://nats.nats.svc.cluster.local:4222"
  stream: "ASSET_EVENTS"
  # For secured NATS, create a tenant-specific Secret with keys username/password.
  existingSecret: ""
