{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incident-service.postgresServiceName" . }}
  labels:
    {{- include "incident-service.postgresLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate # one ReadWriteOnce volume: a rolling update would deadlock on it
  selector:
    matchLabels:
      {{- include "incident-service.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "incident-service.postgresSelectorLabels" . | nindent 8 }}
    spec:
      # The official image runs as uid 999; set explicitly so the restricted
      # Pod Security profile accepts it and the volume is writable (fsGroup).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "incident-service.postgresSecretName" . }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata # subdirectory: the volume root contains lost+found
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "incident-service.fullname" . }}-postgres-pvc
        - name: run
          emptyDir: {}
{{- end }}
