{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "incident-service.postgresSecretName" . }}
  labels:
    {{- include "incident-service.postgresLabels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "postgres.auth.password (or postgres.auth.existingSecret) is required" .Values.postgres.auth.password | quote }}
{{- end }}
